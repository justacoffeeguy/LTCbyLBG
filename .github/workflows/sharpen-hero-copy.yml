name: Sharpen Hero Copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update only hero titles and subtitles
        shell: python
        run: |
          from pathlib import Path

          edits = {
              "index.html": [
                  ("<h1>One of Retirement's Biggest Blind Spots</h1>", "<h1>One of retirement's biggest blind spots.</h1>"),
                  ("<p class=\"lead\">Long-term care is one of the biggest expenses most families never see coming - and it can put retirement savings at risk.</p>", "<p class=\"lead\">Long-term care can put decades of saving, planning, and independence at risk.</p>"),
              ],
              "why-ltc.html": [
                  ("<h1>Why Long-Term Care Insurance Matters</h1>", "<h1>Care can last longer than you think.</h1>"),
                  ("<p class=\"lead\">Most families assume Medicare, Medicaid, or their own savings will cover it if the time comes. Here's where each one actually falls short.</p>", "<p class=\"lead\">See why Medicare, Medicaid, and savings alone may not be enough.</p>"),
              ],
              "explore-plans.html": [
                  ("<h1>Three ways to insure the long-term care risk.</h1>", "<h1>One risk. Three ways to plan.</h1>"),
                  ("<p class=\"lead\">Once you've decided you don't want the entire cost of care resting on your savings or your family, the next question is how to structure the protection. These are the three main insurance paths Les helps clients compare.</p>", "<p class=\"lead\">Each type of long-term care plan solves the same problem in a different way.</p>"),
              ],
              "calculate-plans.html": [
                  ("<h1>Put the numbers around your plan.</h1>", "<h1>Run the numbers.</h1>"),
                  ("<p>Estimate future care costs, adjust timing and care assumptions, and see how different levels of insurance protection could change the financial exposure left to you and your family.</p>", "<p>See how time, care costs, and insurance coverage can change the picture.</p>"),
              ],
              "about.html": [
                  ("<h1>More than 40 years helping people make confident financial decisions.</h1>", "<h1>Advice built on experience.</h1>"),
                  ("<p class=\"lead\">Les brings decades of experience across investment management, wealth planning, retirement planning, asset protection, estate planning strategies, and long-term care. Today, he applies that broader financial perspective exclusively to helping individuals and couples prepare for long-term care.</p>", "<p class=\"lead\">More than 40 years in financial planning shaped how Les approaches long-term care today.</p>"),
              ],
          }

          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected hero copy not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit the surgical copy changes and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/sharpen-hero-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why-ltc.html explore-plans.html calculate-plans.html about.html .github/workflows/sharpen-hero-copy.yml
          git commit -m "Sharpen page hero copy"
          git push
